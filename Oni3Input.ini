; Oni3Input.ini - Onimusha 3 controller setup (generated from your Oni3Input.log)
; Put next to dinput8.dll. Applies on next game start.

[General]
; Write OniInput.log next to the DLL (very useful while diagnosing)
Log=1
; Hide the OS's own gamepad entries so the game only sees the SDL one
HideRealGamepads=1
; Show the virtual pad even if no controller is plugged in at launch
AlwaysExpose=1
; Vibration: emulate DirectInput force feedback and drive the pad's rumble motors via SDL
Rumble=0
; Overall rumble scale (100 = as the game asks; 0..200)
RumbleStrengthPercent=100
; Which connected controller to use (0 = first)
ControllerIndex=0
DeadzonePercent=15
TriggerThresholdPercent=50
ButtonCount=16

; ---- Layer 1: what each virtual axis / button physically is ---
[Axes]
X=LeftX
Y=LeftY
Z=None
Rx=RightX
Ry=RightY
Rz=None

[Buttons]
Button0=A
Button1=B
Button2=X
Button3=Y
Button4=LB
Button5=RB
Button6=LT
Button7=RT
Button8=Back
Button9=Start
Button10=LeftStick
Button11=RightStick
Button12=Guide

; --- Layer 2: which virtual axis/button each GAME ACTION uses ---
; ActionN = index [N] in the log's action list. Names are the game's own (machine-translated).
; Only indexes 0-18 and 69 matter; 19-68 are keyboard/mouse-only entries and are ignored.
[Actions]
Action0=Axis1
Action1=Axis0
Action2=Axis3
Action3=Axis4
Action4=Button0    ; Examine / Confirm            <- A
Action5=Button1    ; Absorb Souls / Cancel        <- B
Action6=Button2    ; Attack                       <- X
Action7=Button3    ; Special Attack       	  <- Y
Action8=Button4    ; Block                        <- LB
Action9=Button5    ; Ready Stance                 <- RB
Action10=Button6   ; Display current location     <- LT
Action11=Button7   ; 180 turn			  <- RT
Action12=Button8   ; Pause	   	          <- Back/Select
Action13=Button9   ; Inventory Screen	          <- Start
Action14=None
Action15=None
Action16=Button11  ; Onimusha Mode		  <- R3
Action17=None      ; Left rotation  (turn left)   - unbound
Action18=None      ; Right rotation (turn right)  - unbound
Action69=Hat       ; Direction key                <- D-pad
